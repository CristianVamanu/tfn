# This dashboard shows your real balances/positions/trade history, so it's
# protected with HTTP basic auth (see README "Deploy" step for how to create
# /etc/nginx/.trading-htpasswd) - there's no login system inside the app itself.
server {
    listen 80;
    listen [::]:80;
    server_name theforgenetwork.net www.theforgenetwork.net;

    auth_basic "AI Trading Platform";
    auth_basic_user_file /etc/nginx/.trading-htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

