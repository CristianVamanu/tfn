{% extends "base.html" %}
{% block title %}Log in — THE FORGE NETWORK{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1>Log in</h1>
  <p class="muted">Welcome back.</p>
  <form id="login-form" style="margin-top:20px;">
    <div class="form-field"><label>Email</label><input type="email" id="email" required autocomplete="email"></div>
    <div class="form-field"><label>Password</label><input type="password" id="password" required autocomplete="current-password"></div>
    <button type="submit" class="btn btn-primary" style="width:100%;">Log in</button>
  </form>
  <div class="form-msg" id="msg"></div>
  <p class="muted" style="margin-top:18px;">No account? <a href="/signup" style="color:var(--gold-text);">Sign up</a></p>
</div>
<script>
document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const msg = document.getElementById("msg");
  msg.className = "form-msg";
  msg.textContent = "Logging in...";
  try {
    const res = await fetch("/api/login", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (data.error) {
      msg.className = "form-msg err";
      msg.textContent = data.error;
      return;
    }
    window.location.href = "/dashboard";
  } catch (err) {
    msg.className = "form-msg err";
    msg.textContent = "Something went wrong - try again.";
  }
});
</script>
{% endblock %}
