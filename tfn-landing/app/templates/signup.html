{% extends "base.html" %}
{% block title %}Sign up — THE FORGE NETWORK{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1>Create your account</h1>
  <p class="muted">Start building.</p>
  <form id="signup-form" style="margin-top:20px;">
    <div class="form-field"><label>Email</label><input type="email" id="email" required autocomplete="email"></div>
    <div class="form-field"><label>Password</label><input type="password" id="password" required minlength="8" autocomplete="new-password"></div>
    <p class="muted" style="font-size:12.5px; margin:-8px 0 16px;">At least 8 characters.</p>
    <button type="submit" class="btn btn-primary" style="width:100%;">Sign up</button>
  </form>
  <div class="form-msg" id="msg"></div>
  <p class="muted" style="margin-top:18px;">Already have an account? <a href="/login" style="color:var(--gold-text);">Log in</a></p>
</div>
<script>
document.getElementById("signup-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const msg = document.getElementById("msg");
  msg.className = "form-msg";
  msg.textContent = "Creating account...";
  try {
    const res = await fetch("/api/signup", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (data.error) {
      msg.className = "form-msg err";
      msg.textContent = data.error;
      return;
    }
    window.location.href = "/dashboard";
  } catch (err) {
    msg.className = "form-msg err";
    msg.textContent = "Something went wrong - try again.";
  }
});
</script>
{% endblock %}
