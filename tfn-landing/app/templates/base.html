<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}THE FORGE NETWORK{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --bg:#08080a; --surface:#131317; --surface-2:#1b1b21; --border:#28282f; --border-soft:#1c1c22; --text:#f5f5f3; --text-dim:#9b9ba5; --text-faint:#5d5d68; --gold:#f0b23e; --gold-text:#f7c766; --indigo:#6f6ff6; --green:#4fd67f; --sans:"Inter",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; }
  .container { max-width: 1100px; margin:0 auto; padding: 0 24px; }
  nav.topnav { position: sticky; top:0; z-index:50; background:rgba(8,8,10,.82); backdrop-filter: blur(14px); border-bottom:1px solid var(--border-soft); }
  nav.topnav .container { display:flex; align-items:center; height:68px; gap:28px; }
  .logo { font-weight:900; font-size:17px; display:flex; align-items:center; gap:8px; }
  .logo .mark { width:9px; height:9px; background:var(--gold); border-radius:2px; box-shadow:0 0 12px var(--gold); }
  .navauth { margin-left:auto; display:flex; gap:12px; align-items:center; font-size:14px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 22px; border-radius:10px; font-size:14px; font-weight:700; cursor:pointer; border:none; transition:transform .15s ease, box-shadow .2s ease; }
  .btn-sm { padding:8px 16px; font-size:13px; }
  .btn-primary { background:linear-gradient(135deg, var(--gold), #e0912a); color:#1a0f02; }
  .btn-primary:hover { box-shadow:0 8px 26px rgba(240,178,62,.3); }
  .btn-ghost { background:rgba(255,255,255,.03); color:var(--text); border:1px solid var(--border); }
  .btn-ghost:hover { border-color:#45454f; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:28px; }
  .page { padding:60px 0 100px; min-height: 70vh; }
  .form-field { margin-bottom:16px; }
  .form-field label { display:block; font-size:13px; font-weight:600; color:var(--text-dim); margin-bottom:6px; }
  .form-field input, .form-field select { width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:12px 14px; border-radius:10px; font-size:14.5px; font-family:inherit; }
  .form-msg { font-size:13.5px; margin-top:10px; min-height:18px; }
  .form-msg.err { color:#f26b78; } .form-msg.ok { color:var(--green); }
  .auth-card { max-width:420px; margin: 40px auto 0; }
  h1,h2,h3 { font-weight:800; margin:0 0 8px; }
  .muted { color:var(--text-dim); font-size:14.5px; }
  table.simple { width:100%; border-collapse:collapse; font-size:13.5px; }
  table.simple th, table.simple td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--border-soft); }
  table.simple th { color:var(--text-faint); font-weight:700; text-transform:uppercase; font-size:11px; letter-spacing:.05em; }
  .stat-row { display:flex; gap:16px; flex-wrap:wrap; margin-bottom: 28px; }
  .stat { flex:1; min-width:140px; }
  .stat .n { font-size:28px; font-weight:900; }
  .stat .l { font-size:12.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em; }
  {% block extra_style %}{% endblock %}
</style>
</head>
<body>
<nav class="topnav">
  <div class="container">
    <a href="/" class="logo"><span class="mark"></span>TFN</a>
    <div class="navauth">
      {% if user %}
        <a href="/dashboard" class="muted">Dashboard</a>
        {% if user.is_admin %}<a href="/admin" class="muted">Admin</a>{% endif %}
        <form action="/api/logout" method="post" style="display:inline;margin:0;">
          <button type="submit" class="btn btn-ghost btn-sm">Log out</button>
        </form>
      {% else %}
        <a href="/login" class="btn btn-ghost btn-sm">Log in</a>
        <a href="/signup" class="btn btn-primary btn-sm">Sign up</a>
      {% endif %}
    </div>
  </div>
</nav>
<div class="page"><div class="container">
{% block content %}{% endblock %}
</div></div>
</body>
</html>
