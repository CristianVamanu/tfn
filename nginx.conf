# CreatorPulse default nginx.conf
# ------------------------------------------------------------
# How to use this file
# 1. Upload this nginx.conf to your server.
# 2. Open /etc/nginx/nginx.conf (or the root config your host uses).
# 3. Replace its contents with the text in this file.
# 4. Update the lines marked with UPPERCASE placeholders.
#    - YOUR_DOMAIN_NAME_HERE ➜ your actual domain (add/remove hostnames as needed)
#    - /var/www/html ➜ the folder where you uploaded CreatorPulse
#    - PHP_FPM_SOCKET ➜ ask your host (examples: unix:/run/php/php8.2-fpm.sock or 127.0.0.1:9000)
# 5. Save the file and reload Nginx: sudo nginx -t && sudo systemctl reload nginx
# If any step feels unclear, forward this file to your hosting provider—they will apply it for you.

user  nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    map $http_accept $creatorpulse_webp_ext {
        default "";
        "~*webp" ".webp";
    }

    server {
        listen 80;
        server_name YOUR_DOMAIN_NAME_HERE www.YOUR_DOMAIN_NAME_HERE;  # Update this line
        root /var/www/html;                                           # Update this line
        index index.php index.html;
        # Increase for large media uploads (videos). Adjust to your server limits.
        client_max_body_size 256m;
        client_body_timeout 300s;
        send_timeout 300s;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~* \.(?:jpe?g|png)$ {
            try_files $uri$creatorpulse_webp_ext $uri =404;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location ~* \.(?:css|js|mjs|json|xml|svg|gif|webp|avif|ico)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location ~* \.(?:woff2?|ttf|otf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Access-Control-Allow-Origin "*" always;
        }

        location ~ \.php$ {
            add_header Cache-Control "no-store, max-age=0" always;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_pass PHP_FPM_SOCKET;  # Update this line
            fastcgi_connect_timeout 60s;
            fastcgi_send_timeout 300s;
            fastcgi_read_timeout 300s;
            # Optional: set PHP limits here if php.ini cannot be edited
            # fastcgi_param PHP_VALUE "upload_max_filesize=256M \n post_max_size=256M \n max_execution_time=300 \n max_input_time=300";
        }

        location ~* \.html$ {
            add_header Cache-Control "no-store, max-age=0";
            try_files $uri =404;
        }

        location ~ /\. {
            deny all;
        }

        location ^~ /includes/ {
            deny all;
        }

        location ^~ /install/database/ {
            deny all;
        }

        location /install/ {
            deny all;
        }

        location ~ ^/install/(index|installer_cleanup)\.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_pass PHP_FPM_SOCKET;  # Update this line
        }

        location ^~ /uploads/ {
            autoindex off;
        }

        location ~* ^/uploads/.*\.(?:php|phtml|phar|cgi|pl|sh|exe|bin)$ {
            deny all;
        }
    }
}
