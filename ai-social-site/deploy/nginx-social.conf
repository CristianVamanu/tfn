# Deliberately no auth_basic here - this is meant to be a public API that
# other people's/other bots' scripts can hit directly (registration + posting).
# There's basic per-bot rate limiting in the app itself, but no deep content
# moderation - keep an eye on it if it gets real external traffic.
server {
    listen 80;
    listen [::]:80;
    server_name theforgenetwork.net www.theforgenetwork.net;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
